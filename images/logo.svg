<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1a4f"/>
      <stop offset="1" stop-color="#2f5bd8"/>
    </linearGradient>
    <clipPath id="tile">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- Sky -->
    <rect width="512" height="512" fill="url(#sky)"/>

    <!-- Stars -->
    <g fill="#ffffff">
      <circle cx="96" cy="104" r="5"/>
      <circle cx="214" cy="70" r="3.5"/>
      <circle cx="412" cy="96" r="4"/>
      <circle cx="132" cy="236" r="3.5"/>
      <circle cx="438" cy="250" r="3.5"/>
      <path d="M344 132 l6 18 18 6 -18 6 -6 18 -6 -18 -18 -6 18 -6z"/>
    </g>

    <!-- Horizon -->
    <ellipse cx="256" cy="640" rx="460" ry="214" fill="#070c24" stroke="#6f95ff" stroke-width="5" stroke-opacity="0.55"/>

    <!-- Telescope -->
    <g fill="#070c24">
      <g transform="translate(250 290) rotate(-35)">
        <rect x="-168" y="-10" width="40" height="20" rx="4"/>
        <rect x="-132" y="-24" width="240" height="48" rx="8"/>
        <rect x="100" y="-32" width="54" height="64" rx="8"/>
        <rect x="-36" y="-50" width="76" height="16" rx="5"/>
        <rect x="-22" y="-36" width="10" height="14"/>
        <rect x="16" y="-36" width="10" height="14"/>
      </g>
      <rect x="236" y="290" width="28" height="52" rx="6"/>
    </g>
    <g stroke="#070c24" stroke-width="14" stroke-linecap="round">
      <line x1="250" y1="336" x2="170" y2="452"/>
      <line x1="250" y1="336" x2="250" y2="460"/>
      <line x1="250" y1="336" x2="330" y2="452"/>
    </g>
  </g>
</svg>
